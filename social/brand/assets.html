<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@700;800&family=Rubik:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0C4068;--deep:#082B47;--sky:#39ABE2;--coral:#E8635A}
*{margin:0;box-sizing:border-box}body{font-family:Rubik,sans-serif;color:#fff}
.a{position:relative;overflow:hidden;background:radial-gradient(ellipse 70% 60% at 85% 10%,rgba(57,171,226,.22),transparent 60%),linear-gradient(160deg,var(--navy),var(--deep))}
#profile{width:1080px;height:1080px;display:grid;place-items:center}#profile img{width:560px}
#cover{width:1640px;height:624px;padding:70px 90px;display:flex;flex-direction:column;justify-content:space-between}
#cover .logo{height:72px}#cover h1{font-family:'Frank Ruhl Libre',serif;font-weight:800;font-size:96px;line-height:1.08;letter-spacing:-.02em;max-width:22ch}
#cover h1 em{font-style:normal;color:var(--sky)}#cover .url{font-weight:700;font-size:34px;direction:ltr;text-align:right;color:rgba(255,255,255,.75)}
.hl{width:1080px;height:1080px;display:grid;place-items:center;text-align:center;padding:60px}
.hl b{font-family:'Frank Ruhl Libre',serif;font-weight:800;font-size:230px;line-height:1.0}.hl b em{font-style:normal;color:var(--sky)}
</style></head><body>
<div id="profile" class="a"><img src="hk-mark-white.png"></div>
<div id="cover" class="a"><img class="logo" src="logo-white.png" style="align-self:flex-start"><h1>אתה מייעץ.<br><em>ה-AI ואנחנו עושים את כל השאר.</em></h1><div class="url">studio.hak.co.il</div></div>
<div id="hl1" class="a hl"><b>מה<br><em>נוחת</em><br>אצלך</b></div>
<div id="hl2" class="a hl"><b>מי<br>עושה<br><em>מה</em></b></div>
<div id="hl3" class="a hl"><b>הלקוח<br><em>שלך</em></b></div>
<div id="hl4" class="a hl"><b>אופיר<br><em>עונה</em></b></div>
<div id="hl5" class="a hl"><b>שלושים<br><em>דקות</em></b></div>
</body></html>
