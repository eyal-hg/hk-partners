<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>HK Studio — סיור במערכת</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=Frank+Ruhl+Libre:wght@700;800&display=swap" />
  <style>
    :root { --navy:#0C4068; --deep:#082B47; --bg:#0A1F33; --sky:#39ABE2; --coral:#E8635A; --ink:#EAF1F8; --muted:rgba(255,255,255,.62); --rail-w:272px; }
    * { box-sizing:border-box; }
    html, body { height:100%; margin:0; background:var(--bg); color:var(--ink); font-family:Rubik,system-ui,sans-serif; overflow:hidden; }
    body { background: radial-gradient(ellipse 60% 50% at 90% 0%, rgba(57,171,226,.14), transparent 60%), var(--bg); }

    /* ── הסרגל: העתק של הסרגל במערכת, הפריט הנוכחי מודגש ── */
    .rail { position:fixed; top:0; bottom:0; right:0; width:var(--rail-w); background:#fff; color:var(--navy); padding:22px 18px; display:flex; flex-direction:column; gap:2px; transform:translateX(100%); transition:transform .45s cubic-bezier(.2,.8,.2,1); z-index:3; overflow:hidden; }
    .rail.on { transform:none; }
    .rail .brand { height:28px; align-self:flex-start; margin:0 6px 14px; }
    .rail .sec { font-size:.72rem; color:#7A8A99; letter-spacing:.06em; margin:10px 12px 2px; }
    .rail .it { display:flex; align-items:center; gap:10px; padding:7px 14px; border-radius:12px; font-size:.98rem; color:#1E3A55; font-weight:500; transition:background .25s, color .25s; cursor:pointer; }
    .rail .it i { width:16px; height:16px; border-radius:4px; border:1.6px solid currentColor; opacity:.55; flex:none; }
    .rail .it.on { background:var(--navy); color:#fff; box-shadow:0 8px 20px rgba(12,64,104,.28); } .rail .it.on i { opacity:1; }
    .rail .it small { display:block; font-size:.72rem; font-weight:400; opacity:.7; line-height:1.1; }
    .rail .t { display:flex; align-items:center; gap:8px; font-size:.74rem; color:#7A8A99; margin:8px 14px 0; } .rail .t b { width:8px; height:8px; border-radius:50%; background:currentColor; }
    .rail .t.now { color:var(--coral); } .rail .t.fut { color:var(--sky); }
    .rail .sub { margin-inline-start:22px; }

    /* ── השקפים ── */
    .slide { position:absolute; inset:0; display:none; }
    .slide.on { display:block; }
    .scr { height:100%; padding:34px 44px 30px; padding-right:calc(var(--rail-w) + 36px); display:grid; grid-template-rows:auto 1fr; gap:18px; transition:padding .45s; }
    body.norail .scr { padding-right:44px; }
    .scr .head { display:flex; align-items:baseline; gap:22px; flex-wrap:wrap; }
    .scr .k { color:var(--sky); font-weight:700; font-size:.9rem; letter-spacing:.06em; white-space:nowrap; }
    .scr h1 { font-family:'Frank Ruhl Libre',Georgia,serif; font-weight:800; font-size:clamp(1.5rem,2.6vw,2.4rem); margin:0; line-height:1.15; }
    .scr h1 em { font-style:normal; color:var(--sky); }
    .scr .sub { color:var(--muted); font-size:1rem; margin:0; max-width:70ch; flex-basis:100%; }
    .win { position:relative; align-self:start; justify-self:center; width:100%; max-height:100%; aspect-ratio:1428/980; border-radius:14px; overflow:hidden; background:#0F2A44; border:1px solid rgba(255,255,255,.12); box-shadow:0 46px 110px rgba(0,0,0,.55); }
    .win.full { aspect-ratio:1680/1050; }
    .win .vp { position:absolute; inset:0; overflow:hidden; }
    .win img { position:absolute; top:0; left:0; width:117.65%; height:auto; max-width:none; transition:transform .7s cubic-bezier(.2,.8,.2,1); transform-origin:50% 50%; }
    .win.full img { width:100%; }
    .win.zoomed img { transform:scale(var(--z,2)); }
    .pin { position:absolute; transform:translate(50%,-50%); display:flex; align-items:center; gap:10px; opacity:0; transition:opacity .3s; z-index:2; pointer-events:none; }
    .pin.on { opacity:1; }
    .pin b { width:34px; height:34px; border-radius:50%; background:var(--coral); color:#fff; display:grid; place-items:center; font-weight:700; font-size:1rem; box-shadow:0 0 0 6px rgba(232,99,90,.28), 0 10px 24px rgba(0,0,0,.35); flex:none; }
    .pin span { background:#fff; color:var(--navy); padding:8px 14px; border-radius:10px; font-size:.95rem; font-weight:500; white-space:nowrap; box-shadow:0 12px 30px rgba(0,0,0,.35); }
    .pin.l { flex-direction:row-reverse; transform:translate(50%,-50%); }
    .missing { position:absolute; inset:0; display:grid; place-items:center; text-align:center; color:var(--muted); padding:40px; }
    .missing b { display:block; color:#fff; font-family:'Frank Ruhl Libre',serif; font-size:1.6rem; margin-bottom:8px; }

    /* ── שקפי טיפוגרפיה / קטע ── */
    .type { place-items:center; text-align:center; padding:60px; }
    .slide.on.type { display:grid; }
    .type h1 { font-family:'Frank Ruhl Libre',Georgia,serif; font-weight:800; font-size:clamp(2.6rem,6vw,5.6rem); line-height:1.08; margin:0 0 16px; max-width:16ch; letter-spacing:-.01em; }
    .type h1 em { font-style:normal; color:var(--sky); }
    .type p { color:var(--muted); font-size:clamp(1.05rem,1.5vw,1.35rem); max-width:52ch; margin:0 auto; line-height:1.65; }
    .type .logo { height:60px; filter:brightness(0) invert(1); margin-bottom:34px; }
    .type .k { color:var(--sky); letter-spacing:.14em; font-weight:700; margin-bottom:14px; }
    .walk { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:30px; }
    .walk span { padding:12px 20px; border-radius:50px; border:1px solid rgba(255,255,255,.3); font-size:1.1rem; opacity:.35; transition:all .3s; }
    .walk span.on { opacity:1; background:#fff; color:var(--navy); border-color:#fff; }

    /* ── ניווט ── */
    .prog { position:fixed; left:0; bottom:0; height:3px; background:var(--sky); width:0; transition:width .3s; z-index:4; }
    .cnt { position:fixed; bottom:12px; left:22px; color:var(--muted); font-size:.82rem; direction:ltr; z-index:4; }
    .hint { position:fixed; bottom:12px; right:calc(var(--rail-w) + 22px); color:var(--muted); font-size:.78rem; z-index:4; transition:right .45s; }
    body.norail .hint { right:22px; }
    @media (max-width:980px) { :root { --rail-w:0px; } .rail { display:none; } .scr { padding:20px 16px 40px !important; } .pin span { font-size:.8rem; } }
    @media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
  </style>
</head>
<body>

  <!-- ═══ הסרגל של היועץ ═══ -->
  <aside class="rail" id="rail-adv">
    <img class="brand" src="assets/logo.png" alt="HK Studio" />
    <div class="it" data-k="today"><i></i>היום</div>
    <div class="it" data-k="tasks"><i></i>משימות</div>
    <div class="it" data-k="cal"><i></i>יומן</div>

    <div class="it" data-k="clients"><i></i>התיק שלי</div>
  </aside>

  <!-- ═══ הסרגל של החברה — לפי המערכת החיה ═══ -->
  <aside class="rail" id="rail-co">
    <img class="brand" src="assets/logo.png" alt="HK Studio" />
    <div class="it" data-k="dash"><i></i>דשבורד</div>
    <div class="sec">תקשורת</div>

    <div class="sec">ניהול</div>
    <div class="it" data-k="flow"><i></i>התהליך שלי</div>
    <div class="it" data-k="coset"><i></i>הגדרות חברה</div>
  </aside>

  <div id="slides"></div>

  <div class="prog" id="prog"></div>
  <div class="cnt" id="cnt"></div>
  <div class="hint">← / רווח: הבא · F: מסך מלא</div>

  <script>
  /* ── התוכן: כל מסך = צילום, כותרת, שורה, ונקודות שנחשפות בלחיצה [x%, y%, טקסט, צד, זום] ── */
  var S = [
    { type:'cover', logo:true, h:'סיור <em>במערכת.</em>', p:'המסכים לפי סדר הסרגל: קודם הסרגל של היועץ — מעל כל הלקוחות. אחר כך הסרגל של החברה — בתוך לקוח אחד.' },
    { type:'sec', k:'חלק ראשון', h:'הסרגל של היועץ', p:'חמישה מסכים, מעל כל הלקוחות.', walk:['היום','משימות','יומן','תקשורת','התיק שלי'] },

    { rail:'adv', k:'today', kk:'היום', h:'מה מחכה ליועץ <em>היום.</em>', p:'מסך הפתיחה של כל בוקר.', img:'adv-today',
      pins:[[87,12,'הפגישות של היום — עם ההכנה שלהן'],[58,14,'המשימות שחולצו מפגישות ושיחות'],[12,22,'מה שחזר מהלקוחות ודורש את היועץ','l']] },
    { rail:'adv', k:'tasks', kk:'משימות', h:'כל המשימות, <em>לכל הלקוחות.</em>', p:'של היועץ, של הצוות, ומה שכבר נסגר — עם המקור של כל אחת.', img:'adv-tasks',
      pins:[[86,12,'המשימות שלי — מקובצות לפי לקוח'],[38,10,'משימה חדשה — ידנית, או מפגישה'],[84,62,'לכל לקוח: מה פתוח ומה נסגר']] },
    { rail:'adv', k:'cal', kk:'יומן', h:'הפגישות — <em>וההכנה שלהן.</em>', p:'יום, שבוע וחודש. מכל פגישה נפתחת ההכנה.', img:'adv-cal',
      pins:[[55,30,'השבוע — פגישות, שיחות, תזכורות'],[88,58,'הפגישה הבאה: מה מוכן ומה חסר']] },
    { rail:'adv', k:'comm', kk:'תקשורת', h:'כל הערוצים, <em>כל הלקוחות.</em>', p:'קבוצות וואטסאפ, שיחות טלפון, פגישות ושאלות לעוזר — בטבלה אחת.', img:'adv-comm-wa',
      pins:[[60,12,'סינון לפי ערוץ: פגישות · טלפון · וואטסאפ · עוזר AI'],[84,30,'לכל פריט: סיכום, מה חסר, ומה ממתין לאישור'],[14,32,'הסיכום הלילי של הקבוצה','l'],[14,56,'מה נכנס לזיכרון הלקוח','l']] },

    { rail:'co', k:'fcast', kk:'תזרים · מה יהיה · תכנון תזרימי', h:'חודשים <em>קדימה.</em>', p:'בפועל מול תחזית מול יעד, לפי קטגוריות. עריכת תא קובעת יעד.', img:'co-fcast',

    { rail:'co', k:'flow', kk:'ניהול · התהליך שלי', h:'איך עובדים עם הלקוח הזה — <em>כתוב פעם אחת.</em>', p:'מפגשים, נושאים, סיכומים לאישור. המערכת עובדת לפי הדרך של היועץ.', img:'co-flow',

    { rail:null, k:'cli', kk:'מסך הלקוח', h:'במותג <em>המשרד.</em>', p:'הלקוח רואה את הנתונים שלו, את המשימות ואת העוזר — עם הלוגו של המשרד.', img:'cli/cli-dash', full:true,

    { type:'cover', logo:true, h:'', p:'studio.hak.co.il' }
  ];

  /* ── בנייה ── */
  var root = document.getElementById('slides');
  S.forEach(function (s) {
    var el = document.createElement('section'); el.className = 'slide';
    if (s.type === 'cover') {
      el.className += ' type'; el.innerHTML = '<div>' + (s.logo ? '<img class="logo" src="assets/logo.png" alt="HK Studio">' : '') + (s.h ? '<h1>' + s.h + '</h1>' : '') + '<p>' + s.p + '</p></div>';
    } else if (s.type === 'sec') {
      el.className += ' type'; el.innerHTML = '<div><div class="k">' + s.k + '</div><h1>' + s.h + '</h1><p>' + s.p + '</p><div class="walk">' + s.walk.map(function (w) { return '<span>' + w + '</span>'; }).join('') + '</div></div>';
      el.dataset.steps = s.walk.length;
    } else {
      var src = s.img.indexOf('/') > -1 ? 'assets/shots/' + s.img + '.png' : 'assets/shots/all/' + s.img + '.png';
      var pins = (s.pins || []).map(function (p, n) {
        var x = p[0], y = p[1], side = p[3] === 'l' ? ' l' : '';
        return '<div class="pin' + side + '" style="right:' + (100 - x) + '%;top:' + y + '%" data-zoom="' + (p[4] || '') + '" data-x="' + x + '" data-y="' + y + '"><b>' + (n + 1) + '</b><span>' + p[2] + '</span></div>';
      }).join('');
      var miss = '<div class="missing"><div><b>' + (s.missing || 'הצילום חסר') + '</b>' + s.kk + '</div></div>';
      el.innerHTML = '<div class="scr"><div class="head"><span class="k">' + s.kk + '</span><h1>' + s.h + '</h1><p class="sub">' + s.p + '</p></div>' +
        '<div class="win' + (s.full ? ' full' : '') + '"><div class="vp"><img src="' + src + '" alt="" loading="eager"></div>' + pins + '</div></div>';
      var im = el.querySelector('img'); im.addEventListener('error', function () { im.style.display = 'none'; im.parentNode.insertAdjacentHTML('beforeend', miss); });
      el.dataset.steps = (s.pins || []).length;
    }
    root.appendChild(el);
  });

  /* ── ניווט: צעדים בתוך שקף (נקודות / פריטי הסרגל), ואז שקף הבא ── */
  var slides = [].slice.call(root.children), i = 0, step = 0;
  var rails = { adv: document.getElementById('rail-adv'), co: document.getElementById('rail-co') };
  function showRail(s) {
    Object.keys(rails).forEach(function (k) { rails[k].classList.toggle('on', s.rail === k); });
    document.body.classList.toggle('norail', !s.rail);
    if (s.rail) rails[s.rail].querySelectorAll('.it').forEach(function (it) { it.classList.toggle('on', it.dataset.k === s.k); });
  }
  function render() {
    var s = S[i], el = slides[i];
    slides.forEach(function (x, k) { x.classList.toggle('on', k === i); });
    showRail(s);
    el.querySelectorAll('.walk span').forEach(function (w, k) { w.classList.toggle('on', k < step); });
    var pins = el.querySelectorAll('.pin'), win = el.querySelector('.win');
    pins.forEach(function (p, k) { p.classList.toggle('on', k < step); });
    if (win) {
      var img = win.querySelector('img'), cur = step > 0 ? pins[step - 1] : null, z = cur && cur.dataset.zoom;
      if (z && img) { img.style.transformOrigin = cur.dataset.x + '% ' + cur.dataset.y + '%'; win.style.setProperty('--z', z); win.classList.add('zoomed'); }
      else win.classList.remove('zoomed');
    }
    document.getElementById('cnt').textContent = (i + 1) + ' / ' + S.length;
    document.getElementById('prog').style.width = (i / (S.length - 1) * 100) + '%';
    history.replaceState(null, '', '#' + (i + 1));
  }
  function next() { var max = +slides[i].dataset.steps || 0; if (step < max) { step++; } else if (i < S.length - 1) { i++; step = 0; } render(); }
  function prev() { if (step > 0) { step--; } else if (i > 0) { i--; step = +slides[i].dataset.steps || 0; } render(); }
  function goto(n) { i = Math.max(0, Math.min(S.length - 1, n)); step = 0; render(); }
  document.addEventListener('keydown', function (e) {
    if (['ArrowLeft', ' ', 'PageDown', 'Enter', 'ArrowDown'].indexOf(e.key) > -1) { e.preventDefault(); next(); }
    else if (['ArrowRight', 'PageUp', 'Backspace', 'ArrowUp'].indexOf(e.key) > -1) { e.preventDefault(); prev(); }
    else if (e.key === 'Home') goto(0); else if (e.key === 'End') goto(S.length - 1);
    else if (e.key.toLowerCase() === 'f') { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); }
  });
  document.addEventListener('click', function (e) { if (e.target.closest('.rail')) return; e.clientX < window.innerWidth * .8 ? next() : prev(); });
  Object.keys(rails).forEach(function (k) { rails[k].querySelectorAll('.it').forEach(function (it) { it.addEventListener('click', function () { var n = S.findIndex(function (s) { return s.rail === k && s.k === it.dataset.k; }); if (n > -1) goto(n); }); }); });
  var tx = null; document.addEventListener('touchstart', function (e) { tx = e.touches[0].clientX; });
  document.addEventListener('touchend', function (e) { if (tx == null) return; var dx = e.changedTouches[0].clientX - tx; if (Math.abs(dx) > 40) dx < 0 ? next() : prev(); tx = null; });
  goto((parseInt(location.hash.slice(1), 10) || 1) - 1);
  </script>
</body>
</html>
